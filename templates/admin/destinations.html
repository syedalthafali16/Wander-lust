{% extends "base.html" %}
{% block content %}

<section class="container">

  <!-- HEADER -->
  <div class="page-header">
    <h2>Manage Destinations</h2>
    <a href="{{ url_for('add_destination') }}" class="btn-primary">
      + Add Destination
    </a>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>City</th>
          <th>Country</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for d in destinations %}
        <tr>

          <td>{{ d.id }}</td>
          <td>{{ d.city }}</td>
          <td>{{ d.country }}</td>

          <td class="actions">
            <a href="{{ url_for('edit_destination', id=d.id) }}" class="btn-edit">
              Edit
            </a>

            <a href="{{ url_for('delete_destination', id=d.id) }}"
               onclick="return confirm('Delete this destination?')"
               class="btn-delete">
              Delete
            </a>
          </td>

        </tr>
        {% endfor %}
      </tbody>

    </table>

  </div>

</section>

{% endblock %}
