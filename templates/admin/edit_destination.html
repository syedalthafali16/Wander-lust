{% extends "base.html" %}
{% block content %}

<section class="container narrow">

  <div class="card">

    <h2 class="page-title">Edit Destination</h2>

    <form method="POST">

      <div class="form-group">
        <label>City</label>
        <input type="text" name="city" value="{{ destination.city }}" required>
      </div>

      <div class="form-group">
        <label>Country</label>
        <input type="text" name="country" value="{{ destination.country }}" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description">{{ destination.description }}</textarea>
      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input type="text" name="image" value="{{ destination.image }}">
      </div>

      <button type="submit" class="btn-primary full-width">
        Update Destination
      </button>

    </form>

  </div>

</section>

{% endblock %}
