{% extends "base.html" %}
{% block content %}

<section class="container">

  <!-- HEADER -->
  <div class="page-header">
    <h2>Your Planned Journeys ✈️</h2>
    <a href="{{ url_for('planner') }}" class="btn-primary">+ New Plan</a>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>

      <thead>
        <tr>
          <th>Destination</th>
          <th>Date</th>
          <th>Budget</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for trip in trips %}
        <tr>

          <td class="strong">{{ trip[1] }}</td>

          <td>
            <i data-lucide="calendar"></i>
            {{ trip[2] }}
          </td>

          <td class="accent">₹{{ trip[3] }}</td>

          <td class="actions">
            <a href="{{ url_for('edit', id=trip[0]) }}" class="btn-edit">
              Edit
            </a>

            <a href="{{ url_for('delete', id=trip[0]) }}"
               onclick="return confirm('Delete this trip?')"
               class="btn-delete">
              Delete
            </a>
          </td>

        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>

</section>

<script>lucide.createIcons();</script>

{% endblock %}
